<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Automata Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-house-fill"></i> Home
            </a>
            <span class="navbar-brand mx-auto h1">Automata Explorer</span>
            <div class="dropdown">
                <button class="navbar-brand btn btn-link dropdown-toggle" style="text-decoration: none;" type="button"
                    id="accountDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i> Account
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
                    <li><a class="dropdown-item" href="#"><i class="bi bi-person"></i> Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                        <li><a class="dropdown-item" href="/auth/logout"><i class="bi bi-box-arrow-right"></i> Log out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="main">
        <!-- Sidebar -->
        <div class="sidebar-container">
            <div class="sidebar" id="problemSidebar">
                <div class="p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Problems</h5>
                        <button class="btn btn-sm btn-link d-md-none" id="closeSidebar">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <button class="btn btn-success w-100 mb-3" data-bs-toggle="modal"
                        data-bs-target="#createProblemModal">
                        <i class="bi bi-plus-circle"></i> Create New Problem
                    </button>
                    <div class="accordion" id="problemAccordion">
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#dfaCollapse">
                                    DFA Problems
                                </button>
                            </h2>
                            <div id="dfaCollapse" class="accordion-collapse collapse show">
                                <div class="accordion-body">
                                    <div class="list-group" id="dfaProblemList"></div>
                                </div>
                            </div>
                        </div>
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#nfaCollapse">
                                    NFA Problems
                                </button>
                            </h2>
                            <div id="nfaCollapse" class="accordion-collapse collapse">
                                <div class="accordion-body">
                                    <div class="list-group" id="nfaProblemList"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main content area -->
        <div class="content">
            <button class="btn btn-primary d-md-none mb-3" id="showSidebar">
                <i class="bi bi-list"></i> Show Problems
            </button>
            <!-- Main content area -->
            <div class="container">
                <h2>Welcome to Automata Explorer, Teacher</h2>
                <div class="card mt-4" id="automataEditor">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Automata Editor</h5>
                        <div class="btn-group">
                            <button class="btn btn-outline-primary" id="saveAutomataBtn">
                                <i class="bi bi-save"></i> Save
                            </button>
                            <button class="btn btn-outline-danger" id="clearAutomataBtn">
                                <i class="bi bi-trash"></i> Clear
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col">
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-outline-secondary" id="setInitialBtn">Set Initial</button>
                                    <button class="btn btn-sm btn-outline-secondary" id="addStateBtn">Add State</button>
                                    <button class="btn btn-sm btn-outline-secondary" id="addTransitionBtn">Add Transition</button>
                                    <button class="btn btn-sm btn-outline-secondary" id="deleteStateBtn">Delete State</button>
                                    <button class="btn btn-sm btn-outline-secondary" id="deleteTransitionBtn">Delete Transition</button>
                                </div>
                            </div>
                        </div>
                        <div id="automataDiagram" style="height: 500px; border: 1px solid #ccc;">
                            <canvas id="graphContainer" style="width: 100%; height: 100%;"></canvas>
                        </div>
                    </div>
                </div>
                <!--Edit problem-->
                <div id="editProblem"></div>
            </div>
        </div>
    </div>

    <footer class="d-flex flex-wrap justify-content-center align-items-center py-3 border-top">
        <div class="d-flex align-items-center">
            <a href="/" class="me-2 text-body-secondary text-decoration-none lh-1">
                <svg class="bi" width="30" height="24">
                    <use xlink:href="#bootstrap"></use>
                </svg>
            </a>
            <span class="text-body-secondary">© 2025 Automata Explorer</span>
        </div>
    </footer>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="/js/main.js"></script>
    <script src="/js/automata-editor.js"></script>

    <!-- MODALS -->
    <div class="modal fade" id="createProblemModal" tabindex="-1" aria-labelledby="createProblemModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createProblemModalLabel">Create New Problem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createProblemForm">
                        <div class="mb-3">
                            <label for="problemTitle" class="form-label">Problem Title</label>
                            <input type="text" class="form-control" id="problemTitle" name="problemTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="problemType" class="form-label">Problem Type</label>
                            <select class="form-select" id="problemType" name="problemType" required>
                                <option value="dfa">DFA</option>
                                <option value="nfa">NFA</option>
                                <option value="pda">PDA</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="problemDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="problemDescription" name="problemDesc" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info" onclick="createWithAI()">
                        <i class="bi bi-robot"></i> Create with AI
                    </button>
                    <button type="button" class="btn btn-primary" onclick="createProblem()">Create</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
